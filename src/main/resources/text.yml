# MiaoLogin 进服消息配置 v1.6 喵
#
# 本文件用于配置玩家加入服务器时自动显示的欢迎语和服务器规则。
# 所有消息均支持 Minecraft & 颜色代码。

# 是否启用进服欢迎语和规则
enabled: true

# 玩家进服时立即在聊天框显示的欢迎语 (可多行)
welcome:
  - "&d&l=========================="
  - "&b  欢迎来到服务器喵！"
  - "&a  本服使用 MiaoLogin 登录插件喵~"
  - "&d&l=========================="

# 打开登录 GUI 前显示的服务器规则 (可多行)
rules:
  - "&e&l【服务器规则】"
  - "&7 1. 禁止使用外挂、脚本或作弊客户端喵"
  - "&7 2. 尊重其他玩家，禁止辱骂、刷屏或恶意骚扰喵"
  - "&7 3. 请妥善保管自己的账户密码喵"
  - "&7 4. 违反规则可能会被踢出或封禁喵"
  - "&c登录/注册后即可开始游戏喵！"
